<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 Misti Divine</title>
  
  <!-- Preload Critical Background Image for Deployment -->
  <link rel="preload" as="image" href="./jaga.png">

  <!-- SEO & PWA Meta -->
  <meta name="description" content="A peaceful daily spiritual companion inspired by Lord Jagannath and Lord Hanuman.">
  <meta name="theme-color" content="#06020e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Odia:wght@400;600&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desktop Wrapper for Mobile-First Frame Centering -->
  <div class="mobile-frame-wrapper">
    
    <!-- Mobile App Viewport (100dvh Lock) -->
    <main class="app-viewport">
      
      <!-- Dynamic Aurora Mesh Gradient Overlay -->
      <div class="aurora-mesh-overlay"></div>

      <!-- 60 FPS Interactive Canvas Particle System -->
      <canvas id="particleCanvas" class="particle-canvas"></canvas>

      <!-- Single Screen Content Frame -->
      <div class="content-frame">
        
        <!-- 1. Clean Native Header Bar ("Misti Divine 🌸") -->
        <header class="greeting-header">
          <div class="mobile-notch-bar">
            <h1 class="notch-title">Misti Divine 🌸</h1>
          </div>
        </header>

        <!-- 2. Clean Open Art Stage (Displays full-res jaga.png artwork cleanly) -->
        <section class="art-stage"></section>

        <!-- 3. Primary Letter Teaching Card -->
        <section class="main-card-section">
          <article class="glass-card primary-teaching-card tilt-card shimmer-card" id="tiltCard">
            <div class="card-border-glow"></div>
            <div class="card-specular-reflection"></div>
            
            <h2 class="greeting-title glowing-text-flow" id="greetingText">Good Morning, Misti 🌸</h2>
            <p class="primary-thought-text typewriter-text" id="primaryThought"></p>
            
            <!-- Jewel Emblem Divider -->
            <div class="jewel-emblem-divider">
              <span class="divider-line"></span>
              <div class="jewel-orb-3d">
                <span class="orb-core">🌸</span>
                <span class="orb-ring"></span>
              </div>
              <span class="divider-line"></span>
            </div>
          </article>
        </section>

        <!-- 4. Twin Sub-Columns (Left: Thought / Right: Guidance) -->
        <section class="twin-columns-section">
          <article class="sub-column left-column glass-subcard">
            <span class="column-label">TODAY'S THOUGHT</span>
            <p class="column-body typewriter-text" id="thoughtBody"></p>
          </article>
          
          <div class="column-divider"></div>

          <article class="sub-column right-column glass-subcard">
            <span class="column-label">DAILY GUIDANCE</span>
            <p class="column-body typewriter-text" id="guidanceBody"></p>
          </article>
        </section>

        <!-- 5. Decorative Lotus Accents (Outside text cards) -->
        <div class="corner-lotus-bottom-left">
          <svg viewBox="0 0 100 100" class="corner-lotus-svg">
            <path d="M 50 8 Q 78 45 50 92 Q 22 45 50 8 Z" fill="#f43f5e" opacity="0.85"/>
            <path d="M 50 22 Q 88 45 78 88 Q 35 70 50 22 Z" fill="#fb7185" opacity="0.75"/>
            <path d="M 50 22 Q 12 45 22 88 Q 65 70 50 22 Z" fill="#fb7185" opacity="0.75"/>
          </svg>
        </div>

        <div class="corner-lotus-bottom-right">
          <svg viewBox="0 0 100 100" class="corner-lotus-svg">
            <path d="M 50 8 Q 78 45 50 92 Q 22 45 50 8 Z" fill="#d946ef" opacity="0.85"/>
            <path d="M 50 22 Q 88 45 78 88 Q 35 70 50 22 Z" fill="#f472b6" opacity="0.75"/>
            <path d="M 50 22 Q 12 45 22 88 Q 65 70 50 22 Z" fill="#f472b6" opacity="0.75"/>
          </svg>
        </div>

        <div class="bottom-nav-dot">
          <span class="dot-orb">✨</span>
        </div>

      </div>
    </main>
  </div>

  <!-- Modular Engines Launcher -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
