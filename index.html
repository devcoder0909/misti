<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 Misti's Divine Companion</title>
  
  <!-- SEO & PWA Meta -->
  <meta name="description" content="A peaceful daily spiritual companion inspired by Lord Jagannath and Lord Hanuman.">
  <meta name="theme-color" content="#0c061a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Odia:wght@400;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Single Viewport App Container (100dvh) -->
  <main class="app-viewport">
    
    <!-- 60 FPS Canvas Particle Background -->
    <canvas id="particleCanvas" class="particle-canvas"></canvas>

    <!-- Background Fireworks / Starburst Layer -->
    <div class="sky-fireworks-layer">
      <svg viewBox="0 0 400 400" class="fireworks-svg">
        <!-- Left Firework -->
        <g transform="translate(60, 60)" stroke="rgba(217, 70, 239, 0.35)" stroke-width="1" stroke-dasharray="2 3">
          <line x1="0" y1="-30" x2="0" y2="30"/>
          <line x1="-30" y1="0" x2="30" y2="0"/>
          <line x1="-20" y1="-20" x2="20" y2="20"/>
          <line x1="-20" y1="20" x2="20" y2="-20"/>
        </g>
        <!-- Right Firework -->
        <g transform="translate(340, 70)" stroke="rgba(255, 215, 0, 0.3)" stroke-width="1" stroke-dasharray="2 3">
          <line x1="0" y1="-25" x2="0" y2="25"/>
          <line x1="-25" y1="0" x2="25" y2="0"/>
          <line x1="-18" y1="-18" x2="18" y2="18"/>
          <line x1="-18" y1="18" x2="18" y2="-18"/>
        </g>
      </svg>
    </div>

    <!-- Single Screen Content Frame -->
    <div class="content-frame">
      
      <!-- 1. Top Navigation Bar (Exact Reference Header) -->
      <header class="greeting-header">
        <div class="header-top-bar">
          <span class="header-dots">•••</span>
          <span class="header-subtitle">Divine Teachings</span>
          <span class="header-pill"></span>
        </div>
      </header>

      <!-- 2. Divine Stage (Highlights full-res jaga.png background artwork) -->
      <section class="art-stage">
        <!-- Rotating Gold Mandala Halo Ring -->
        <div class="mandala-ring">
          <svg viewBox="0 0 200 200" class="mandala-svg">
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255, 215, 0, 0.4)" stroke-width="1.5" stroke-dasharray="4 6"/>
            <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(217, 70, 239, 0.35)" stroke-width="1"/>
            <path d="M 100 10 L 100 190 M 10 100 L 190 100 M 36 36 L 164 164 M 36 164 L 164 36" stroke="rgba(255, 215, 0, 0.25)" stroke-width="1"/>
          </svg>
        </div>
        
        <div class="divine-halo"></div>
      </section>

      <!-- 3. Primary Main Card ("Teachings & Bhakti" / Greeting Box) -->
      <section class="main-card-section">
        <article class="glass-card primary-teaching-card shimmer-card">
          <div class="card-border-glow"></div>
          <h1 class="greeting-title" id="greetingText">Good Morning, Misti 🌸</h1>
          <p class="primary-thought-text" id="primaryThought">Maan mein shanti ho toh har din ek utsav jaisa lagta hai.</p>
          
          <!-- Exact Reference Jewel Emblem Divider -->
          <div class="jewel-emblem-divider">
            <span class="divider-line"></span>
            <span class="jewel-orb">🔵</span>
            <span class="divider-line"></span>
          </div>
        </article>
      </section>

      <!-- 4. Twin Bottom Columns (Left: Thought / Right: Guidance) -->
      <section class="twin-columns-section">
        <article class="sub-column left-column">
          <span class="column-label">TODAY'S THOUGHT</span>
          <p class="column-body" id="thoughtBody">...</p>
        </article>
        
        <div class="column-divider"></div>

        <article class="sub-column right-column">
          <span class="column-label">DAILY GUIDANCE</span>
          <p class="column-body" id="guidanceBody">...</p>
        </article>
      </section>

      <!-- 5. Bottom Lotus Flower & Indicator (Exact Reference) -->
      <div class="bottom-lotus-left">
        <svg viewBox="0 0 100 100" class="corner-lotus-svg">
          <path d="M 50 10 Q 75 45 50 90 Q 25 45 50 10 Z" fill="#f43f5e" opacity="0.9"/>
          <path d="M 50 25 Q 85 45 75 85 Q 35 70 50 25 Z" fill="#fb7185" opacity="0.8"/>
          <path d="M 50 25 Q 15 45 25 85 Q 65 70 50 25 Z" fill="#fb7185" opacity="0.8"/>
          <path d="M 50 40 Q 90 60 70 95 Q 30 95 50 40 Z" fill="#e11d48" opacity="0.85"/>
        </svg>
      </div>

      <div class="bottom-nav-dot">
        <span class="dot-orb">💧</span>
      </div>

    </div>
  </main>

  <!-- Modular Engines Launcher -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
