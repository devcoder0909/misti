<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 Misti Divine</title>
  
  <!-- SEO & PWA Meta -->
  <meta name="description" content="A peaceful daily spiritual companion inspired by Lord Jagannath and Lord Hanuman.">
  <meta name="theme-color" content="#06020e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Odia:wght@400;600&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desktop Wrapper for Mobile-First Frame Centering -->
  <div class="mobile-frame-wrapper">
    
    <!-- Mobile App Viewport (100dvh Lock) -->
    <main class="app-viewport">
      
      <!-- Dynamic Aurora Mesh Gradient Overlay -->
      <div class="aurora-mesh-overlay"></div>

      <!-- 60 FPS Interactive Canvas Particle System -->
      <canvas id="particleCanvas" class="particle-canvas"></canvas>

      <!-- Background Starburst & Fireworks Layer -->
      <div class="sky-fireworks-layer">
        <svg viewBox="0 0 400 400" class="fireworks-svg">
          <g transform="translate(60, 50)" stroke="rgba(217, 70, 239, 0.35)" stroke-width="1.2" stroke-dasharray="2 3">
            <line x1="0" y1="-30" x2="0" y2="30"/>
            <line x1="-30" y1="0" x2="30" y2="0"/>
            <line x1="-20" y1="-20" x2="20" y2="20"/>
            <line x1="-20" y1="20" x2="20" y2="-20"/>
          </g>
          <g transform="translate(340, 60)" stroke="rgba(255, 215, 0, 0.3)" stroke-width="1.2" stroke-dasharray="2 3">
            <line x1="0" y1="-25" x2="0" y2="25"/>
            <line x1="-25" y1="0" x2="25" y2="0"/>
            <line x1="-18" y1="-18" x2="18" y2="18"/>
            <line x1="-18" y1="18" x2="18" y2="-18"/>
          </g>
        </svg>
      </div>

      <!-- Single Screen Content Frame -->
      <div class="content-frame">
        
        <!-- 1. Native Header Bar ("Misti Divine", No 3 Dots) -->
        <header class="greeting-header">
          <div class="mobile-notch-bar">
            <span class="notch-title">Misti Divine 🌸</span>
            <div class="notch-icons">
              <span class="icon-signal">📶</span>
              <span class="icon-wifi">📡</span>
              <span class="icon-battery">🔋</span>
            </div>
          </div>
        </header>

        <!-- 2. Divine Stage (Center Aura Halo) -->
        <section class="art-stage">
          <!-- Rotating Divine Light Rays -->
          <div class="divine-light-rays">
            <svg viewBox="0 0 300 300" class="rays-svg">
              <g stroke="rgba(255, 215, 0, 0.15)" stroke-width="1.5">
                <line x1="150" y1="0" x2="150" y2="300"/>
                <line x1="0" y1="150" x2="300" y2="150"/>
                <line x1="44" y1="44" x2="256" y2="256"/>
                <line x1="44" y1="256" x2="256" y2="44"/>
              </g>
            </svg>
          </div>

          <!-- Rotating Gold & Magenta Mandala Halo Ring -->
          <div class="mandala-ring">
            <svg viewBox="0 0 200 200" class="mandala-svg">
              <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6"/>
              <circle cx="100" cy="100" r="76" fill="none" stroke="url(#magentaGrad)" stroke-width="1.2"/>
              <path d="M 100 8 L 100 192 M 8 100 L 192 100 M 35 35 L 165 165 M 35 165 L 165 35" stroke="rgba(255, 215, 0, 0.25)" stroke-width="1"/>
              <defs>
                <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ffd700"/>
                  <stop offset="100%" stop-color="#f59e0b"/>
                </linearGradient>
                <linearGradient id="magentaGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#d946ef"/>
                  <stop offset="100%" stop-color="#8b5cf6"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          
          <div class="divine-halo"></div>
        </section>

        <!-- 3. Primary Letter Teaching Card -->
        <section class="main-card-section">
          <article class="glass-card primary-teaching-card tilt-card shimmer-card" id="tiltCard">
            <div class="card-border-glow"></div>
            <div class="card-specular-reflection"></div>
            
            <h1 class="greeting-title glowing-text-flow" id="greetingText">Good Morning, Misti 🌸</h1>
            <p class="primary-thought-text typewriter-text" id="primaryThought"></p>
            
            <!-- Jewel Emblem Divider -->
            <div class="jewel-emblem-divider">
              <span class="divider-line"></span>
              <div class="jewel-orb-3d">
                <span class="orb-core">🌸</span>
                <span class="orb-ring"></span>
              </div>
              <span class="divider-line"></span>
            </div>
          </article>
        </section>

        <!-- 4. Twin Sub-Columns (Left: Thought / Right: Guidance) -->
        <section class="twin-columns-section">
          <article class="sub-column left-column glass-subcard">
            <span class="column-label">TODAY'S THOUGHT</span>
            <p class="column-body typewriter-text" id="thoughtBody"></p>
          </article>
          
          <div class="column-divider"></div>

          <article class="sub-column right-column glass-subcard">
            <span class="column-label">DAILY GUIDANCE</span>
            <p class="column-body typewriter-text" id="guidanceBody"></p>
          </article>
        </section>

        <!-- 5. Multiple Decorative Lotus Accents (Positioned OUTSIDE text cards) -->
        <div class="corner-lotus-bottom-left">
          <svg viewBox="0 0 100 100" class="corner-lotus-svg">
            <path d="M 50 8 Q 78 45 50 92 Q 22 45 50 8 Z" fill="#f43f5e" opacity="0.85"/>
            <path d="M 50 22 Q 88 45 78 88 Q 35 70 50 22 Z" fill="#fb7185" opacity="0.75"/>
            <path d="M 50 22 Q 12 45 22 88 Q 65 70 50 22 Z" fill="#fb7185" opacity="0.75"/>
          </svg>
        </div>

        <div class="corner-lotus-bottom-right">
          <svg viewBox="0 0 100 100" class="corner-lotus-svg">
            <path d="M 50 8 Q 78 45 50 92 Q 22 45 50 8 Z" fill="#d946ef" opacity="0.85"/>
            <path d="M 50 22 Q 88 45 78 88 Q 35 70 50 22 Z" fill="#f472b6" opacity="0.75"/>
            <path d="M 50 22 Q 12 45 22 88 Q 65 70 50 22 Z" fill="#f472b6" opacity="0.75"/>
          </svg>
        </div>

        <div class="bottom-nav-dot">
          <span class="dot-orb">✨</span>
        </div>

      </div>
    </main>
  </div>

  <!-- Modular Engines Launcher -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
