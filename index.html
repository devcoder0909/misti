<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Misti Divine</title>

  <!-- Preload Background Images & Misti Profile Avatar -->
  <link rel="preload" as="image" href="./bg%20image.png">
  <link rel="preload" as="image" href="./bg2%20image.png">
  <link rel="preload" as="image" href="./misti.jpg">
  
  <!-- SEO & PWA Meta -->
  <meta name="description" content="A peaceful daily spiritual companion inspired by Lord Jagannath and Lord Hanuman.">
  <meta name="theme-color" content="#090514">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans, Outfit, Noto Sans Odia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Odia:wght@600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desktop Wrapper for Mobile-First Frame Centering -->
  <div class="mobile-frame-wrapper">

    <!-- Mobile Viewport Lock (100dvh) -->
    <main class="app-viewport">
      
      <!-- Dual Crossfade Rotating Background Layers -->
      <div class="bg-layer bg-layer-1" id="bgLayer1"></div>
      <div class="bg-layer bg-layer-2" id="bgLayer2"></div>

      <!-- Divine Golden Sunbeam Rays Effect Layer -->
      <div class="god-rays-layer"></div>

      <!-- 60 FPS Canvas Particle Background -->
      <canvas id="particleCanvas" class="particle-canvas"></canvas>

      <!-- Single Screen Content Frame -->
      <div class="content-frame">
        
        <!-- 1. Centered Header Bar ("Misti Divine" & Dynamic Auto-Fetched Day/Date) -->
        <header class="greeting-header">
          <div class="mobile-notch-bar">
            <h1 class="header-brand-title">Misti Divine</h1>
          </div>
          <p class="header-date-badge" id="headerDate">Wednesday, 5 August</p>
        </header>

        <!-- 2. Clean Open Art Stage -->
        <section class="art-stage"></section>

        <!-- 3. Primary Main Glass Teaching Card with Rich Internal Ornaments -->
        <section class="main-card-section">
          
          <!-- Misti Profile Avatar (Unclipped Floating Circle) -->
          <div class="misti-avatar-frame">
            <img src="misti.jpg" alt="Misti" class="misti-avatar-img">
          </div>

          <article class="glass-card primary-teaching-card shimmer-card">
            <div class="card-border-glow"></div>
            
            <!-- Slow Rotating Sacred Lotus Mandala Watermark Inside Card -->
            <div class="card-mandala-watermark">
              <svg viewBox="0 0 200 200" class="mandala-svg">
                <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255, 215, 0, 0.15)" stroke-width="1.2" stroke-dasharray="4,4"/>
                <circle cx="100" cy="100" r="65" fill="none" stroke="rgba(255, 215, 0, 0.2)" stroke-width="1"/>
                <path d="M 100 10 C 120 50 120 150 100 190 C 80 150 80 50 100 10 Z" fill="none" stroke="rgba(255, 215, 0, 0.18)" stroke-width="1"/>
                <path d="M 10 100 C 50 120 150 120 190 100 C 150 80 50 80 10 100 Z" fill="none" stroke="rgba(255, 215, 0, 0.18)" stroke-width="1"/>
                <path d="M 36 36 C 75 75 125 125 164 164 M 164 36 C 125 75 75 125 36 164" stroke="rgba(255, 215, 0, 0.15)" stroke-width="1"/>
              </svg>
            </div>

            <!-- Corner Floral Filigree SVGs Inside Message Box -->
            <div class="card-corner-floral top-left-floral">
              <svg viewBox="0 0 40 40"><path d="M 5 5 C 18 5 35 18 35 35 M 5 15 C 15 15 25 25 25 35" stroke="rgba(255, 215, 0, 0.55)" stroke-width="1.2" fill="none"/></svg>
            </div>
            <div class="card-corner-floral top-right-floral">
              <svg viewBox="0 0 40 40"><path d="M 35 5 C 22 5 5 18 5 35 M 35 15 C 25 15 15 25 15 35" stroke="rgba(255, 215, 0, 0.55)" stroke-width="1.2" fill="none"/></svg>
            </div>

            <!-- Clean Title Container without Emojis -->
            <div class="card-title-container">
              <h2 class="greeting-title" id="cardGreeting">Good Morning, Misti</h2>
            </div>

            <p class="primary-thought-text" id="primaryThought">Maan mein shanti ho toh har din ek utsav jaisa lagta hai.</p>
            
            <!-- Jewel Emblem Divider -->
            <div class="jewel-emblem-divider">
              <span class="divider-line"></span>
              <div class="jewel-orb-frame">
                <span class="jewel-dot"></span>
                <span class="jewel-pulse-ring"></span>
              </div>
              <span class="divider-line"></span>
            </div>
          </article>
          
          <!-- Dynamic Odia Mantra Badge Just Below Message Box -->
          <div class="mantra-badge-container">
            <span class="odia-mantra-text" id="odiaMantra">ଜୟ ଜଗନ୍ନାଥ</span>
          </div>
        </section>

        <!-- 4. Twin Bottom Columns (Left: Thought / Right: Guidance) -->
        <section class="twin-columns-section">
          <article class="sub-column left-column">
            <div class="column-header-row">
              <span class="column-label">TODAY'S THOUGHT</span>
              <span class="subcard-gem-dot"></span>
            </div>
            <p class="column-body" id="thoughtBody">...</p>
          </article>
          
          <div class="column-divider"></div>

          <article class="sub-column right-column">
            <div class="column-header-row">
              <span class="column-label">DAILY GUIDANCE</span>
              <span class="subcard-gem-dot"></span>
            </div>
            <p class="column-body" id="guidanceBody">...</p>
          </article>
        </section>

        <!-- 5. Multiple Decorative Flower Accents -->
        <div class="corner-lotus-bottom-left">
          <svg viewBox="0 0 100 100" class="corner-lotus-svg">
            <path d="M 50 10 Q 75 45 50 90 Q 25 45 50 10 Z" fill="#f43f5e" opacity="0.85"/>
            <path d="M 50 25 Q 85 45 75 85 Q 35 70 50 25 Z" fill="#fb7185" opacity="0.75"/>
            <path d="M 50 25 Q 12 45 25 85 Q 65 70 50 25 Z" fill="#fb7185" opacity="0.75"/>
          </svg>
        </div>

        <div class="corner-lotus-bottom-right">
          <svg viewBox="0 0 100 100" class="corner-lotus-svg">
            <path d="M 50 10 Q 75 45 50 90 Q 25 45 50 10 Z" fill="#d946ef" opacity="0.85"/>
            <path d="M 50 22 Q 88 45 78 88 Q 35 70 50 22 Z" fill="#f472b6" opacity="0.75"/>
            <path d="M 50 22 Q 12 45 22 88 Q 65 70 50 22 Z" fill="#f472b6" opacity="0.75"/>
          </svg>
        </div>

        <div class="corner-lotus-top-right">
          <svg viewBox="0 0 100 100" class="corner-lotus-svg">
            <path d="M 50 10 Q 75 45 50 90 Q 25 45 50 10 Z" fill="#ffd700" opacity="0.6"/>
            <path d="M 50 25 Q 85 45 75 85 Q 35 70 50 25 Z" fill="#ffb703" opacity="0.5"/>
          </svg>
        </div>

        <div class="bottom-nav-dot">
          <span class="dot-orb">💧</span>
        </div>

      </div>
    </main>
  </div>

  <!-- Modular Engines Launcher -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
